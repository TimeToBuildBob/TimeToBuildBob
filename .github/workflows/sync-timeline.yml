name: Sync timeline

# The month-by-month sections of README.md (between the timeline markers) are
# generated from _data/timeline.yml in TimeToBuildBob/TimeToBuildBob.github.io
# (the source of truth, which also renders https://timetobuildbob.github.io/timeline/)
# by that repo's scripts/render_profile_readme.py. Edit the data there, not here.
# Process doc: ErikBjare/bob knowledge/processes/public-timeline-sync.md

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch timeline data and renderer
        uses: actions/checkout@v4
        with:
          repository: TimeToBuildBob/timetobuildbob.github.io
          path: website
          sparse-checkout: |
            _data/timeline.yml
            scripts/render_profile_readme.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render README
        run: |
          pip install pyyaml
          python website/scripts/render_profile_readme.py README.md --data website/_data/timeline.yml

      - name: Commit if changed
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "README already up to date"
            exit 0
          fi
          git add README.md
          git commit -m "docs(readme): sync timeline from website"
          git push
